<!doctype html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Green Team Assets</title>
  <meta name="apple-mobile-web-app-title" content="Green Team Assets">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#004225">

  <style>
    :root {
      --green-dark: #003d27;
      --green: #005f3d;
      --green-soft: #e9f0eb;
      --yellow: #ffd400;
      --red: #bd2019;
      --bg: #f3f7f3;
      --card: #ffffff;
      --text: #101815;
      --muted: #66706c;
      --border: #dbe2dd;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
    }

    body {
      overflow-x: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      background: linear-gradient(180deg, #f8faf8 0%, #edf4ef 100%);
    }

    .topbar {
      background: linear-gradient(135deg, #005f3d 0%, #003d27 62%, #002819 100%);
      color: white;
      padding: calc(env(safe-area-inset-top, 0px) + 38px) 26px 24px;
      border-bottom: 8px solid var(--yellow);
    }

    .topbar-inner {
      display: grid;
      grid-template-columns: 184px 1fr 150px;
      gap: 24px;
      align-items: center;
      max-width: 980px;
      margin: 0 auto;
    }

    .mccoys-logo {
      width: 184px;
      height: auto;
      display: block;
      flex-shrink: 0;
      object-fit: contain;
    }

    .mccoys-main {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 900;
      letter-spacing: -2px;
      font-size: 39px;
    }

    .mccoys-sub {
      font-weight: 900;
      font-size: 16px;
      margin-top: 5px;
    }

    .header-title h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -.5px;
    }

    .user-line {
      margin-top: 8px;
      font-size: 19px;
      line-height: 1.25;
      color: rgba(255,255,255,.78);
      word-break: break-word;
    }

    .add-btn {
      border: 0;
      background: linear-gradient(180deg, #ffe554 0%, #ffd400 65%, #efbd00 100%);
      color: #003820;
      font-weight: 900;
      font-size: 24px;
      padding: 22px 18px;
      border-radius: 23px;
      box-shadow: 0 6px 14px rgba(0,0,0,.18);
      cursor: pointer;
      white-space: nowrap;
    }

    .content {
      max-width: 980px;
      margin: 0 auto;
      padding: 40px 26px 70px;
    }

    .controls {
      display: grid;
      gap: 18px;
      margin-bottom: 22px;
    }

    .search-wrap {
      position: relative;
    }

    .search,
    .filter {
      width: 100%;
      min-height: 86px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: white;
      padding: 0 26px;
      font-size: 30px;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(0,0,0,.03);
    }

    .search {
      color: #111;
    }

    .search::placeholder {
      color: #aaa;
    }

    .filter {
      appearance: none;
      color: #111;
      background-image:
        linear-gradient(45deg, transparent 50%, #111 50%),
        linear-gradient(135deg, #111 50%, transparent 50%);
      background-position:
        calc(100% - 34px) 38px,
        calc(100% - 24px) 38px;
      background-size: 10px 10px, 10px 10px;
      background-repeat: no-repeat;
    }

    .asset-count {
      margin: 22px 0 28px;
      color: #67716d;
      font-weight: 900;
      font-size: 25px;
    }

    .cards {
      display: grid;
      gap: 24px;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 26px;
      box-shadow: 0 6px 18px rgba(0, 45, 28, .07);
      padding: 30px 26px 26px;
      overflow: hidden;
    }

    .asset-num {
      font-size: 44px;
      line-height: 1;
      color: var(--green);
      font-weight: 950;
      margin-bottom: 22px;
      letter-spacing: .4px;
    }

    .asset-title {
      margin: 0 0 22px;
      font-size: 27px;
      line-height: 1.15;
      font-weight: 950;
      color: #101815;
      text-transform: uppercase;
    }

    .field {
      font-size: 25px;
      margin: 10px 0;
      line-height: 1.25;
      color: #1d2522;
    }

    .field strong {
      color: #66706c;
      font-weight: 900;
    }

    .photo-link {
      display: inline-block;
      margin-top: 12px;
      color: var(--green);
      font-size: 24px;
      font-weight: 900;
      text-decoration: none;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 126px;
      gap: 16px;
      margin-top: 24px;
    }

    .edit-btn,
    .delete-btn {
      min-height: 86px;
      border: 0;
      border-radius: 20px;
      font-weight: 950;
      font-size: 28px;
      cursor: pointer;
    }

    .edit-btn {
      background: #e8eee9;
      color: var(--green);
    }

    .delete-btn {
      background: var(--red);
      color: white;
    }

    .loading,
    .empty {
      background: white;
      border: 1px dashed var(--border);
      border-radius: 24px;
      padding: 30px;
      text-align: center;
      color: var(--muted);
      font-size: 20px;
      font-weight: 800;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 25, 16, .55);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 14px;
      z-index: 1000;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: min(720px, 100%);
      max-height: calc(100vh - 30px);
      overflow: auto;
      background: white;
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 25px 70px rgba(0,0,0,.35);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-head h2 {
      margin: 0;
      color: var(--green);
      font-size: 27px;
      font-weight: 950;
    }

    .close-btn {
      width: 46px;
      height: 46px;
      border-radius: 999px;
      border: 0;
      background: #eef3ef;
      font-size: 30px;
      cursor: pointer;
    }

    .form-grid {
      display: grid;
      gap: 14px;
    }

    .label {
      font-size: 14px;
      font-weight: 900;
      color: #53615b;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .input {
      width: 100%;
      min-height: 52px;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 18px;
      outline: none;
      background: white;
    }

    textarea.input {
      min-height: 90px;
      resize: vertical;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .save-btn,
    .cancel-btn {
      min-height: 56px;
      border: 0;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 950;
      cursor: pointer;
    }

    .save-btn {
      background: var(--green);
      color: white;
    }

    .cancel-btn {
      background: #e8eee9;
      color: var(--green);
    }

    .toast {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 18px;
      background: #101815;
      color: white;
      padding: 14px 16px;
      border-radius: 16px;
      font-weight: 800;
      display: none;
      z-index: 2000;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    .toast.show {
      display: block;
    }

    @media (max-width: 720px) {
      .topbar {
        padding-left: 26px;
        padding-right: 26px;
      }

      .topbar-inner {
        grid-template-columns: 184px 1fr 150px;
        gap: 24px;
      }

      .content {
        padding-left: 26px;
        padding-right: 26px;
      }
    }

    @media (max-width: 520px) {
      .topbar {
        padding-left: 26px;
        padding-right: 26px;
      }

      .topbar-inner {
        grid-template-columns: 184px 1fr 150px;
        gap: 24px;
        min-width: 660px;
      }

      .content {
        min-width: 660px;
      }
    }
  </style>
</head>

    <main class="content">
      <div class="controls">
        <input id="searchInput" class="search" type="search" placeholder="Search asset #, brand, tool, model, serial..." oninput="renderAssets()">

        <select id="statusFilter" class="filter" onchange="renderAssets()">
          <option value="">All status</option>
          <option value="Available">Available</option>
          <option value="Checked Out">Checked Out</option>
          <option value="In Use">In Use</option>
          <option value="Repair">Repair</option>
          <option value="Missing">Missing</option>
          <option value="Retired">Retired</option>
        </select>
      </div>

      <div id="assetCount" class="asset-count">Loading assets...</div>
      <div id="cards" class="cards">
        <div class="loading">Loading assets from Google Sheet...</div>
      </div>
    </main>
  </div>

  <div id="assetModal" class="modal-backdrop" onclick="backdropClose(event)">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle">Add Asset</h2>
        <button class="close-btn" type="button" onclick="closeAssetModal()">×</button>
      </div>

      <form id="assetForm" onsubmit="saveAsset(event)">
        <input type="hidden" id="recordId">

        <div class="form-grid">
          <div>
            <div class="label">Asset #</div>
            <input class="input" id="assetNumber" required>
          </div>

          <div>
            <div class="label">Tool / Asset Name</div>
            <input class="input" id="toolName" required>
          </div>

          <div>
            <div class="label">Brand</div>
            <input class="input" id="brand">
          </div>

          <div>
            <div class="label">Model</div>
            <input class="input" id="model">
          </div>

          <div>
            <div class="label">Serial</div>
            <input class="input" id="serial">
          </div>

          <div>
            <div class="label">Location</div>
            <input class="input" id="location" value="Green Team">
          </div>

          <div>
            <div class="label">Assigned To</div>
            <input class="input" id="assigned">
          </div>

          <div>
            <div class="label">Status</div>
            <select class="input" id="status">
              <option value="Available">Available</option>
              <option value="Checked Out">Checked Out</option>
              <option value="In Use">In Use</option>
              <option value="Repair">Repair</option>
              <option value="Missing">Missing</option>
              <option value="Retired">Retired</option>
            </select>
          </div>

          <div>
            <div class="label">Photo Folder Link</div>
            <input class="input" id="photoFolder" placeholder="Paste Google Drive folder link">
          </div>

          <div>
            <div class="label">Upload Photos</div>
            <input class="input" id="photoFiles" type="file" accept="image/*" multiple>
          </div>

          <div>
            <div class="label">Notes</div>
            <textarea class="input" id="notes"></textarea>
          </div>
        </div>

        <div class="modal-actions">
          <button class="cancel-btn" type="button" onclick="closeAssetModal()">Cancel</button>
          <button class="save-btn" type="submit">Save Asset</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    let ASSETS = [];
    let CURRENT_EDIT = null;

    const SERVER_LOAD_FUNCTIONS = ['getAssets', 'listAssets', 'loadAssets', 'getActiveAssets'];
    const SERVER_SAVE_FUNCTIONS = ['saveAsset', 'upsertAsset', 'addOrUpdateAsset', 'createOrUpdateAsset'];
    const SERVER_DELETE_FUNCTIONS = ['deleteAsset'];

    function init() {
      loadAssets();
    }

    function loadAssets() {
      setLoading('Loading assets from Google Sheet...');

      callServerAny(SERVER_LOAD_FUNCTIONS, [])
        .then(function(data) {
          ASSETS = normalizeAssets(data);
          renderAssets();
        })
        .catch(function(err) {
          console.error(err);
          setLoading('Could not load assets. Check Code.gs function name.');
          showToast('Could not load assets.');
        });
    }

    function renderAssets() {
      const cards = document.getElementById('cards');
      const assetCount = document.getElementById('assetCount');
      const search = String(document.getElementById('searchInput').value || '').toLowerCase().trim();
      const status = String(document.getElementById('statusFilter').value || '').toLowerCase().trim();

      const filtered = ASSETS.filter(function(asset) {
        const haystack = [
          asset.assetNumber,
          asset.toolName,
          asset.brand,
          asset.model,
          asset.serial,
          asset.location,
          asset.assigned,
          asset.status
        ].join(' ').toLowerCase();

        const matchesSearch = !search || haystack.includes(search);
        const matchesStatus = !status || String(asset.status || '').toLowerCase() === status;
        return matchesSearch && matchesStatus;
      });

      assetCount.textContent = filtered.length + ' asset' + (filtered.length === 1 ? '' : 's');

      if (!filtered.length) {
        cards.innerHTML = '<div class="empty">No assets found.</div>';
        return;
      }

      cards.innerHTML = filtered.map(assetCardHtml).join('');
    }

    function assetCardHtml(asset) {
      const photoUrl = firstUrl(asset.photoFolder || asset.photoUrl || asset.photoLink || asset.photos || '');
      const recordId = escapeAttr(asset.recordId || asset.assetNumber);

      return `
        <article class="card">
          <div class="asset-num">${escapeHtml(asset.assetNumber || '')}</div>
          <h2 class="asset-title">${escapeHtml(asset.toolName || '')}</h2>

          <div class="field"><strong>Brand:</strong> ${escapeHtml(asset.brand || '')}</div>
          <div class="field"><strong>Model:</strong> ${escapeHtml(asset.model || '')}</div>
          <div class="field"><strong>Serial:</strong> ${escapeHtml(asset.serial || '')}</div>
          <div class="field"><strong>Location:</strong> ${escapeHtml(asset.location || '')}</div>
          <div class="field"><strong>Assigned:</strong> ${escapeHtml(asset.assigned || '')}</div>

          ${photoUrl
            ? `<a class="photo-link" href="${escapeAttr(photoUrl)}" target="_blank" rel="noopener">Open photo folder</a>`
            : `<span class="photo-link">Open photo folder</span>`}

          <div class="actions">
            <button class="edit-btn" type="button" onclick="editAsset('${recordId}')">Edit</button>
            <button class="delete-btn" type="button" onclick="deleteAsset('${recordId}')"></button>
          </div>
        </article>
      `;
    }

    function openAssetModal() {
      CURRENT_EDIT = null;
      document.getElementById('modalTitle').textContent = 'Add Asset';
      document.getElementById('assetForm').reset();
      document.getElementById('recordId').value = '';
      document.getElementById('location').value = 'Green Team';
      document.getElementById('status').value = 'Available';
      document.getElementById('assetModal').classList.add('show');
    }

    function closeAssetModal() {
      document.getElementById('assetModal').classList.remove('show');
    }

    function backdropClose(event) {
      if (event.target.id === 'assetModal') closeAssetModal();
    }

    function editAsset(recordId) {
      const asset = ASSETS.find(function(a) {
        return String(a.recordId || a.assetNumber) === String(recordId);
      });

      if (!asset) {
        showToast('Asset not found.');
        return;
      }

      CURRENT_EDIT = asset;

      document.getElementById('modalTitle').textContent = 'Edit Asset';
      document.getElementById('recordId').value = asset.recordId || asset.assetNumber || '';
      document.getElementById('assetNumber').value = asset.assetNumber || '';
      document.getElementById('toolName').value = asset.toolName || '';
      document.getElementById('brand').value = asset.brand || '';
      document.getElementById('model').value = asset.model || '';
      document.getElementById('serial').value = asset.serial || '';
      document.getElementById('location').value = asset.location || '';
      document.getElementById('assigned').value = asset.assigned || '';
      document.getElementById('status').value = asset.status || 'Available';
      document.getElementById('photoFolder').value = asset.photoFolder || asset.photoUrl || asset.photoLink || '';
      document.getElementById('notes').value = asset.notes || '';

      document.getElementById('assetModal').classList.add('show');
    }

    function saveAsset(event) {
      event.preventDefault();

      const files = document.getElementById('photoFiles').files;

      const asset = {
        recordId: document.getElementById('recordId').value.trim(),
        assetNumber: document.getElementById('assetNumber').value.trim(),
        toolName: document.getElementById('toolName').value.trim(),
        brand: document.getElementById('brand').value.trim(),
        model: document.getElementById('model').value.trim(),
        serial: document.getElementById('serial').value.trim(),
        location: document.getElementById('location').value.trim(),
        assigned: document.getElementById('assigned').value.trim(),
        status: document.getElementById('status').value.trim(),
        photoFolder: document.getElementById('photoFolder').value.trim(),
        notes: document.getElementById('notes').value.trim()
      };

      if (!asset.recordId) asset.recordId = asset.assetNumber;

      showToast('Saving asset...');

      filesToPayloads(files)
        .then(function(photoPayloads) {
          asset.photoPayloads = photoPayloads;
          return callServerAny(SERVER_SAVE_FUNCTIONS, [asset]);
        })
        .then(function() {
          closeAssetModal();
          showToast('Asset saved.');
          loadAssets();
        })
        .catch(function(err) {
          console.error(err);
          showToast('Could not save asset.');
        });
    }

    function deleteAsset(recordId) {
      if (!confirm('Move this asset to Retired?')) return;

      const asset = ASSETS.find(function(a) {
        return String(a.recordId || a.assetNumber) === String(recordId);
      });

      if (!asset) {
        showToast('Asset not found.');
        return;
      }

      const retiredAsset = {
        recordId: asset.recordId || asset.assetNumber || '',
        assetNumber: asset.assetNumber || '',
        toolName: asset.toolName || '',
        brand: asset.brand || '',
        model: asset.model || '',
        serial: asset.serial || '',
        location: asset.location || '',
        assigned: asset.assigned || '',
        status: 'Retired',
        photoFolder: asset.photoFolder || asset.photoUrl || asset.photoLink || '',
        notes: asset.notes || ''
      };

      showToast('Moving asset to Retired...');

      callServerAny(SERVER_SAVE_FUNCTIONS, [retiredAsset])
        .then(function() {
          showToast('Asset moved to Retired.');
          loadAssets();
        })
        .catch(function(err) {
          console.error(err);
          showToast('Could not move asset to Retired.');
        });
    }

    function callServerAny(functionNames, args) {
      return new Promise(function(resolve, reject) {
        let index = 0;

        function tryNext(lastError) {
          if (index >= functionNames.length) {
            reject(lastError || new Error('No matching server function found.'));
            return;
          }

          const fn = functionNames[index++];

          try {
            if (!google || !google.script || !google.script.run || typeof google.script.run[fn] !== 'function') {
              tryNext(new Error('Server function not available: ' + fn));
              return;
            }

            google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(function(err) {
                tryNext(err);
              })[fn].apply(google.script.run, args || []);
          } catch (err) {
            tryNext(err);
          }
        }

        tryNext();
      });
    }

    function normalizeAssets(data) {
      let rows = [];

      if (Array.isArray(data)) {
        rows = data;
      } else if (data && Array.isArray(data.assets)) {
        rows = data.assets;
      } else if (data && Array.isArray(data.rows)) {
        rows = data.rows;
      }

      return rows.map(function(row, idx) {
        if (Array.isArray(row)) {
          return {
            recordId: row[0] || row[1] || idx,
            assetNumber: row[0] || '',
            toolName: row[1] || '',
            brand: row[2] || '',
            model: row[3] || '',
            serial: row[4] || '',
            location: row[5] || '',
            assigned: row[6] || '',
            status: row[7] || '',
            photoFolder: row[8] || '',
            notes: row[9] || ''
          };
        }

        return {
          recordId: pick(row, ['recordId', 'Record ID', 'ID', 'id', 'rowNumber', 'Row']),
          assetNumber: pick(row, ['assetNumber', 'Asset #', 'Asset Number', 'Asset', 'asset #', 'Asset#']),
          toolName: pick(row, ['toolName', 'Tool Name', 'Tool', 'Asset Name', 'Description', 'Item']),
          brand: pick(row, ['brand', 'Brand']),
          model: pick(row, ['model', 'Model']),
          serial: pick(row, ['serial', 'Serial', 'Serial #', 'Serial Number']),
          location: pick(row, ['location', 'Location']),
          assigned: pick(row, ['assigned', 'Assigned', 'Assigned To', 'assignedTo']),
          status: pick(row, ['status', 'Status']),
          photoFolder: pick(row, ['photoFolder', 'Photo Folder', 'Photo Link', 'Photo Folder Link', 'photoUrl', 'Photos']),
          notes: pick(row, ['notes', 'Notes'])
        };
      }).filter(function(asset) {
        return asset.assetNumber || asset.toolName || asset.brand || asset.serial;
      });
    }

    function pick(obj, keys) {
      for (let i = 0; i < keys.length; i++) {
        if (obj && obj[keys[i]] !== undefined && obj[keys[i]] !== null) {
          return String(obj[keys[i]]);
        }
      }
      return '';
    }

    function filesToPayloads(files) {
      const list = Array.from(files || []);
      return Promise.all(list.map(function(file) {
        return new Promise(function(resolve, reject) {
          const reader = new FileReader();
          reader.onload = function() {
            resolve({
              name: file.name,
              type: file.type,
              dataUrl: reader.result
            });
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }));
    }

    function firstUrl(value) {
      return String(value || '').split(/\s+/).find(function(x) {
        return x.startsWith('http');
      }) || '';
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    function setLoading(message) {
      document.getElementById('assetCount').textContent = 'Loading assets...';
      document.getElementById('cards').innerHTML = '<div class="loading">' + escapeHtml(message) + '</div>';
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');

      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(function() {
        toast.classList.remove('show');
      }, 2800);
    }

    init();
  </script>
</body>
</html>
