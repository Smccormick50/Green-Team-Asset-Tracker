<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Green Team Asset Tracker</title>
  <style>
    :root {
      --green: #0f3a2a;
      --green-2: #165a3d;
      --light: #f4f7f3;
      --card: #ffffff;
      --muted: #68746b;
      --border: #dfe8df;
      --danger: #b42318;
      --shadow: 0 10px 30px rgba(15, 58, 42, .12);
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--light);
      color: #122018;
      padding-bottom: env(safe-area-inset-bottom);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: linear-gradient(135deg, var(--green), var(--green-2));
      color: white;
      padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
      box-shadow: var(--shadow);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      font-size: 20px;
      line-height: 1.1;
      margin: 0;
      letter-spacing: .2px;
    }

    .sub {
      font-size: 12px;
      opacity: .85;
      margin-top: 4px;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin: 8px 0 14px;
    }

    @media (min-width: 740px) {
      .toolbar {
        grid-template-columns: 1fr auto auto;
        align-items: center;
      }
    }

    input, select, textarea, button {
      font: inherit;
      border-radius: 14px;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: white;
      padding: 13px 14px;
      outline: none;
      font-size: 16px;
    }

    textarea { min-height: 90px; resize: vertical; }

    button {
      border: 0;
      padding: 13px 16px;
      font-weight: 700;
      cursor: pointer;
      background: var(--green);
      color: white;
      min-height: 48px;
    }

    button.secondary {
      background: #e8efe8;
      color: var(--green);
    }

    button.danger {
      background: var(--danger);
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .cards {
      display: grid;
      gap: 12px;
    }

    @media (min-width: 740px) {
      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 1020px) {
      .cards {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 3px 18px rgba(15, 58, 42, .06);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .asset-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .asset-id {
      font-size: 22px;
      font-weight: 800;
      color: var(--green);
      letter-spacing: .2px;
    }

    .tag {
      font-size: 12px;
      font-weight: 800;
      border-radius: 999px;
      padding: 6px 9px;
      background: #e8efe8;
      color: var(--green);
      white-space: nowrap;
    }

    .desc {
      font-size: 15px;
      font-weight: 750;
      line-height: 1.25;
    }

    .meta {
      display: grid;
      gap: 6px;
      font-size: 13px;
      color: #344239;
    }

    .meta span {
      color: var(--muted);
      font-weight: 600;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: auto;
    }

    .actions .full { grid-column: 1 / -1; }

    .empty, .loading {
      background: white;
      border: 1px dashed var(--border);
      border-radius: 22px;
      padding: 22px;
      text-align: center;
      color: var(--muted);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: flex-end;
      background: rgba(0,0,0,.35);
    }

    .modal.open { display: flex; }

    .sheet {
      width: 100%;
      max-height: 92vh;
      overflow: auto;
      background: var(--light);
      border-radius: 26px 26px 0 0;
      padding: 14px;
      padding-bottom: calc(18px + env(safe-area-inset-bottom));
    }

    @media (min-width: 760px) {
      .modal {
        align-items: center;
        justify-content: center;
      }
      .sheet {
        width: 720px;
        max-height: 90vh;
        border-radius: 26px;
      }
    }

    .form-card {
      background: white;
      border-radius: 22px;
      border: 1px solid var(--border);
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr 1fr;
      }
      .span-2 { grid-column: span 2; }
    }

    label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 800;
      display: grid;
      gap: 5px;
    }

    .modal-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .modal-title h2 {
      margin: 0;
      color: var(--green);
      font-size: 21px;
    }

    .form-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .photo-link {
      color: var(--green);
      font-weight: 800;
      text-decoration: none;
      word-break: break-word;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-row">
      <div>
        <h1>Green Team Asset Tracker</h1>
        <div class="sub" id="userLine">Loading...</div>
      </div>
      <button id="addBtn" onclick="openForm()">+ Asset</button>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <input id="searchInput" placeholder="Search asset #, brand, tool, model, serial..." oninput="renderAssets()">
      <select id="statusFilter" onchange="renderAssets()">
        <option value="">All status</option>
        <option>Active</option>
        <option>Repair</option>
        <option>Missing</option>
        <option>Retired</option>
      </select>
      <div class="count" id="countLine"></div>
    </div>

    <div id="assetList" class="cards">
      <div class="loading">Loading assets...</div>
    </div>
  </main>

  <div class="modal" id="assetModal">
    <div class="sheet">
      <div class="form-card">
        <div class="modal-title">
          <h2 id="formTitle">Add Asset</h2>
          <button class="secondary" onclick="closeForm()">Close</button>
        </div>

        <div class="form-grid">
          <input type="hidden" id="recordId">

          <label>Asset Number *
            <input id="assetNumber" inputmode="text" autocomplete="off" placeholder="Example: 7300117">
          </label>

          <label>Status
            <select id="status">
              <option>Active</option>
              <option>Repair</option>
              <option>Missing</option>
              <option>Retired</option>
            </select>
          </label>

          <label>Brand
            <input id="brand" placeholder="MILWAUKEE, DEWALT, BOSCH...">
          </label>

          <label>Tool Description *
            <input id="description" placeholder="Cordless drill, ladder, saw...">
          </label>

          <label>Model Number
            <input id="modelNumber">
          </label>

          <label>Serial Number
            <input id="serialNumber">
          </label>

          <label>Asset Tag Y/N
            <select id="assetTag">
              <option value=""></option>
              <option>Y</option>
              <option>N</option>
            </select>
          </label>

          <label>Location
            <input id="location" placeholder="Truck, shop, jobsite...">
          </label>

          <label>Assigned To
            <input id="assignedTo" placeholder="Team member">
          </label>

          <label>Photos
            <input id="photos" type="file" accept="image/*" capture="environment" multiple>
          </label>

          <label class="span-2">Notes
            <textarea id="notes"></textarea>
          </label>
        </div>

        <div class="form-actions">
          <button class="secondary" onclick="closeForm()">Cancel</button>
          <button id="saveBtn" onclick="saveAsset()">Save Asset</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let bootstrap = {};
    let assets = [];
    let activeAssets = [];
    let retiredAssets = [];

    const fields = {
      recordId: document.getElementById('recordId'),
      assetNumber: document.getElementById('assetNumber'),
      brand: document.getElementById('brand'),
      description: document.getElementById('description'),
      modelNumber: document.getElementById('modelNumber'),
      serialNumber: document.getElementById('serialNumber'),
      assetTag: document.getElementById('assetTag'),
      status: document.getElementById('status'),
      location: document.getElementById('location'),
      assignedTo: document.getElementById('assignedTo'),
      notes: document.getElementById('notes'),
      photos: document.getElementById('photos')
    };

    function init() {
      google.script.run
        .withSuccessHandler(data => {
          bootstrap = data;
          document.getElementById('userLine').textContent = `${data.user.email || 'Signed in'} · ${data.user.role}`;
          document.getElementById('addBtn').disabled = !data.canEdit;
          loadAssets();
        })
        .withFailureHandler(showError)
        .getBootstrap();
    }

    function loadAssets() {
      const list = document.getElementById('assetList');
      list.innerHTML = '<div class="loading">Loading assets...</div>';

      google.script.run
        .withSuccessHandler(activeRows => {
          activeAssets = (activeRows || []).map(row => ({ ...row, _source: 'active' }));

          google.script.run
            .withSuccessHandler(retiredRows => {
              retiredAssets = (retiredRows || []).map(row => ({
                ...row,
                Status: 'Retired',
                _source: 'retired'
              }));

              assets = [...activeAssets, ...retiredAssets];
              renderAssets();
            })
            .withFailureHandler(showError)
            .listDeletedAssets();
        })
        .withFailureHandler(showError)
        .listAssets();
    }

    function renderAssets() {
      const list = document.getElementById('assetList');
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const status = document.getElementById('statusFilter').value;

      let filtered = assets.filter(a => {
        const haystack = [
          a['Asset Number'], a['Brand'], a['Tool Description'],
          a['Model Number'], a['Serial Number'], a['Location'],
          a['Assigned To'], a['Notes']
        ].join(' ').toLowerCase();
        const matchesQ = !q || haystack.includes(q);
        const assetStatus = String(a.Status || 'Active').toLowerCase();
        const filterStatus = String(status || '').toLowerCase();
        const matchesStatus = !filterStatus || assetStatus === filterStatus;
        return matchesQ && matchesStatus;
      });

      document.getElementById('countLine').textContent = `${filtered.length} asset${filtered.length === 1 ? '' : 's'}`;

      if (!filtered.length) {
        list.innerHTML = '<div class="empty">No assets found.</div>';
        return;
      }

      list.innerHTML = filtered.map(assetCard).join('');
    }

    function assetCard(a) {
      const recordId = escapeAttr(a['Record ID']);
      const isRetiredArchive = a._source === 'retired';
      const photoUrl = a['Photo Folder URL'] || firstUrl(a['Photo File URLs']);
      const editBtn = bootstrap.canEdit && !isRetiredArchive ? `<button class="secondary" onclick="openForm('${recordId}')">Edit</button>` : '';
      const deleteBtn = bootstrap.canDelete && !isRetiredArchive ? `<button class="danger" onclick="deleteAsset('${recordId}')">Delete</button>` : '';
      const photoBtn = photoUrl ? `<a class="photo-link" target="_blank" href="${escapeAttr(photoUrl)}">Open photo folder</a>` : '<span class="count">No photo yet</span>';
      const archiveNote = isRetiredArchive ? '<div><span>Archive:</span> Deleted asset moved to retired list</div>' : '';

      return `
        <div class="card">
          <div class="asset-top">
            <div class="asset-id">${escapeHtml(a['Asset Number'] || '')}</div>
            <div class="tag">${escapeHtml(a.Status || 'Active')}</div>
          </div>
          <div class="desc">${escapeHtml(a['Tool Description'] || '')}</div>
          <div class="meta">
            <div><span>Brand:</span> ${escapeHtml(a.Brand || '')}</div>
            <div><span>Model:</span> ${escapeHtml(a['Model Number'] || '')}</div>
            <div><span>Serial:</span> ${escapeHtml(a['Serial Number'] || '')}</div>
            <div><span>Location:</span> ${escapeHtml(a.Location || '')}</div>
            <div><span>Assigned:</span> ${escapeHtml(a['Assigned To'] || '')}</div>
            ${archiveNote}
            <div>${photoBtn}</div>
          </div>
          <div class="actions">
            ${editBtn}
            ${deleteBtn}
          </div>
        </div>
      `;
    }

    function openForm(recordId) {
      if (!bootstrap.canEdit) return;
      const a = assets.find(x => String(x['Record ID']) === String(recordId)) || {};
      if (a._source === 'retired') {
        alert('This asset is in the retired/deleted archive. It cannot be edited from the active asset screen.');
        return;
      }
      document.getElementById('formTitle').textContent = a['Record ID'] ? 'Edit Asset' : 'Add Asset';

      fields.recordId.value = a['Record ID'] || '';
      fields.assetNumber.value = a['Asset Number'] || '';
      fields.brand.value = a.Brand || '';
      fields.description.value = a['Tool Description'] || '';
      fields.modelNumber.value = a['Model Number'] || '';
      fields.serialNumber.value = a['Serial Number'] || '';
      fields.assetTag.value = a['Asset Tag Y/N'] || '';
      fields.status.value = a.Status || 'Active';
      fields.location.value = a.Location || 'Green Team';
      fields.assignedTo.value = a['Assigned To'] || '';
      fields.notes.value = a.Notes || '';
      fields.photos.value = '';

      document.getElementById('assetModal').classList.add('open');
    }

    function closeForm() {
      document.getElementById('assetModal').classList.remove('open');
    }

    async function saveAsset() {
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      try {
        if (!fields.assetNumber.value.trim()) throw new Error('Asset Number is required.');
        if (!fields.description.value.trim()) throw new Error('Tool Description is required.');

        const asset = {
          'Record ID': fields.recordId.value,
          'Asset Number': fields.assetNumber.value,
          'Brand': fields.brand.value,
          'Tool Description': fields.description.value,
          'Model Number': fields.modelNumber.value,
          'Serial Number': fields.serialNumber.value,
          'Asset Tag Y/N': fields.assetTag.value,
          'Status': fields.status.value,
          'Location': fields.location.value,
          'Assigned To': fields.assignedTo.value,
          'Notes': fields.notes.value
        };

        const photos = await filesToPayloads(fields.photos.files);

        google.script.run
          .withSuccessHandler(() => {
            saveBtn.disabled = false;
            saveBtn.textContent = 'Save Asset';
            closeForm();
            loadAssets();
          })
          .withFailureHandler(err => {
            saveBtn.disabled = false;
            saveBtn.textContent = 'Save Asset';
            showError(err);
          })
          .saveAsset(asset, photos);

      } catch (err) {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Asset';
        showError(err);
      }
    }

    function deleteAsset(recordId) {
      if (!confirm('Delete this asset from the active list? It will be moved to Deleted Assets.')) return;
      google.script.run
        .withSuccessHandler(loadAssets)
        .withFailureHandler(showError)
        .deleteAsset(recordId);
    }

    function filesToPayloads(files) {
      const list = Array.from(files || []);
      return Promise.all(list.map(file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve({ name: file.name, dataUrl: reader.result });
        reader.onerror = reject;
        reader.readAsDataURL(file);
      })));
    }

    function firstUrl(value) {
      return String(value || '').split(/\s+/).find(x => x.startsWith('http')) || '';
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      })[m]);
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    function showError(err) {
      const msg = err && err.message ? err.message : String(err);
      alert(msg);
      console.error(err);
    }

    init();
  </script>
</body>
</html>
